name: sod_tube
physics:
  model: euler
  dimension: 1
  gas:
    gamma: 1.4
    gas_constant: 287.0
mesh:
  type: structured_1d
  n_cells: 400
  x_min: 0.0
  x_max: 1.0
initial_conditions:
  - region: { x_max: 0.5 }
    density: 1.0
    velocity: 0.0
    pressure: 1.0
  - region: { x_min: 0.5 }
    density: 0.125
    velocity: 0.0
    pressure: 0.1
boundary_conditions:
  left: { type: outflow }
  right: { type: outflow }
numerics:
  flux_scheme: hllc
  reconstruction: muscl
  limiter: minmod
  time_integrator: rk3
  cfl: 0.5
  end_time: 0.2
